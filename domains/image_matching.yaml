name: Image Matching & Feature Detection
description: 'Evolution of image matching methods — from handcrafted features (SIFT)
  and learned matchers (SuperPoint, LoFTR) through pairwise 3D reconstruction (DUSt3R,
  MASt3R) to feed-forward visual geometry transformers (VGGT, Fast3R, CUT3R, Pi3,
  StreamVGGT, MapAnything, VGGT-Omega).

  '
source_awesome_lists:
- https://github.com/shamangary/awesome-local-feature-matching
