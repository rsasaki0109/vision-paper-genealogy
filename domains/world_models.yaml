name: World Models for Robotics & Embodied AI
description: 'From Ha & Schmidhuber''s original World Models through latent dynamics
  learning (Dreamer series), model-based planning (MuZero, TD-MPC), transformer and
  diffusion world models (IRIS, STORM, DIAMOND), JEPA latent predictors (I-JEPA to
  V-JEPA 2.1 / LeWorldModel), to large-scale generative video world simulators (Cosmos,
  Genie, Sora, DreamZero) — the evolution of learned world models for embodied intelligence.

  '
source_awesome_lists:
- https://github.com/danijar/dreamerv3
- https://github.com/opendilab/awesome-model-based-RL
- https://github.com/Li-Zn-H/AwesomeWorldModels
- https://github.com/NJU3DV-LoongGroup/Embodied-World-Models-Survey
- https://github.com/AbdelStark/awesome-jepa
