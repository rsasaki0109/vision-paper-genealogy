name: Imitation Learning & Robot Foundation Models
description: 'From classical behavioral cloning to modern diffusion-based policies,
  action-chunking transformers, and vision-language-action foundation models (OpenVLA,
  Pi0, GR00T, Gemini Robotics, Qwen-VLA, and LingBot-VLA), plus the LeRobot ecosystem
  — the full evolution of learning robot manipulation from demonstrations.

  '
