name: Diffusion Models
description: 'From the foundational denoising diffusion probabilistic models (DDPM)
  and score-based generative modeling through accelerated sampling (DDIM), classifier-free
  guidance, and latent diffusion, to large-scale text-to-image systems (Stable Diffusion,
  DALL-E 2, Imagen), diffusion transformers (DiT), flow matching, and video generation
  (SORA, Stable Video Diffusion, CogVideoX, Open-Sora, HunyuanVideo, Wan, LTX-Video,
  Mochi) - the evolution of diffusion-based generative models.

  '
source_awesome_lists:
- https://github.com/diff-usion/Awesome-Diffusion-Models
- https://github.com/heejkoo/Awesome-Diffusion-Models
